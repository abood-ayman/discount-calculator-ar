<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة الخصم | أداة مجانية</title>
<meta name="description" content="احسب السعر بعد الخصم وكم وفرت، أو اعرف السعر الأصلي قبل الخصم. تعمل على جهازك دون إرسال أي بيانات.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:1.6rem 1rem;text-align:center}
header h1{font-size:1.5rem}
.tagline{opacity:.92;font-size:.95rem;margin-top:.25rem}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:1rem}
.card{background:#fff;border-radius:14px;padding:1.25rem;box-shadow:0 1px 4px rgba(15,23,42,.08);margin-bottom:1rem}
.card h2{font-size:1.1rem;margin-bottom:.4rem;color:#0f766e}
label{display:block;font-weight:700;margin:.75rem 0 .3rem}
input,select,textarea{width:100%;padding:.7rem .8rem;border:1.5px solid #cbd5e1;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:#1e293b}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0f766e;box-shadow:0 0 0 3px rgba(20,184,166,.18)}
.row{display:flex;gap:.6rem}
.row>*{flex:1;min-width:0}
button{display:inline-block;width:100%;padding:.8rem;border:0;border-radius:10px;background:#0f766e;color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:1rem}
button:hover{background:#115e59}
button.ghost{background:#e2e8f0;color:#1e293b}
.result{background:#ecfdf5;border:1.5px solid #6ee7b7;border-radius:10px;padding:1rem;margin-top:1rem;font-size:1.05rem;word-break:break-word}
.result b{color:#047857}
.result.warn{background:#fffbeb;border-color:#fcd34d}
.result.warn b{color:#b45309}
.result.bad{background:#fef2f2;border-color:#fca5a5}
.result.bad b{color:#b91c1c}
.muted{color:#64748b;font-size:.85rem}
footer{background:#0f172a;color:#94a3b8;text-align:center;padding:1.2rem 1rem;font-size:.85rem;line-height:1.9}
footer a{color:#5eead4}
table{width:100%;border-collapse:collapse;margin-top:.5rem}
th,td{padding:.5rem;border-bottom:1px solid #e2e8f0;text-align:right;font-size:.95rem}
.big{font-size:1.6rem;font-weight:800}
.hidden{display:none}
.chk{display:flex;align-items:center;gap:.5rem;margin:.3rem 0}
.chk input{width:auto}

</style>
</head>
<body>
<header>
<h1>حاسبة الخصم</h1>
<p class="tagline">السعر بعد الخصم وكم توفر فعلًا — أو السعر الأصلي قبل العرض</p>
</header>
<main>
<div class="card">
<h2>احسب السعر بعد الخصم</h2>
<label for="price">السعر قبل الخصم (جنيه)</label>
<input type="number" inputmode="decimal" id="price" min="0" placeholder="مثال: 1000">
<div class="row">
<div>
<label for="pct">نسبة الخصم ٪</label>
<input type="number" inputmode="decimal" id="pct" min="0" max="100" placeholder="15">
</div>
<div>
<label for="pct2">خصم إضافي ٪ (اختياري)</label>
<input type="number" inputmode="decimal" id="pct2" min="0" max="100" placeholder="0">
</div>
</div>
<button onclick="calc()">احسب</button>
<div id="out" class="result hidden"></div>
</div>
<div class="card">
<h2>اعرف السعر الأصلي</h2>
<label for="final2">السعر بعد الخصم (جنيه)</label>
<input type="number" inputmode="decimal" id="final2" min="0" placeholder="850">
<label for="pct3">نسبة الخصم التي أعلنها المتجر ٪</label>
<input type="number" inputmode="decimal" id="pct3" min="0" max="99" placeholder="15">
<button class="ghost" onclick="calcRev()">احسب الأصلي</button>
<div id="out2" class="result hidden"></div>
</div>

</main>
<footer>
<p>تعمل هذه الأداة بالكامل على جهازك، ولا تُحفظ أو تُرسل أي بيانات إلى أي خادم.</p>
<p>أداة مجانية مفتوحة المصدر · بُنيت بمساعدة أدوات ذكاء اصطناعي · <a href="https://github.com/abood-ayman/discount-calculator-ar">الكود على GitHub</a></p>
</footer>
<script>
window.__jserrors=[];window.addEventListener('error',function(e){window.__jserrors.push(String(e.message))});
const g = id => document.getElementById(id);
const num = id => { const v = parseFloat(g(id).value); return isNaN(v) ? 0 : v; };
const fmt = x => x.toLocaleString('ar-EG', { maximumFractionDigits: 2 }) + ' جنيه';

function discount(price, pcts) {
  let final = price;
  for (const p of pcts) final *= (1 - p / 100);
  return { final, saved: price - final };
}

function original(final, pct) {
  return pct >= 100 ? NaN : final / (1 - pct / 100);
}

function calc() {
  const price = num('price'), p1 = num('pct'), p2 = num('pct2');
  const r = discount(price, p2 > 0 ? [p1, p2] : [p1]);
  const el = g('out');
  el.classList.remove('hidden');
  el.innerHTML = '<p class="big">السعر بعد الخصم: <b>' + fmt(r.final) + '</b></p>' +
                 '<p>وفرت: <b>' + fmt(r.saved) + '</b></p>' +
                 (p2 > 0 ? '<p class="muted">الخصمان المتتاليان ' + p1 + '٪ ثم ' + p2 + '٪ لا يساويان ' + (p1 + p2) + '٪، بل ' + (100 - (100 - p1) * (100 - p2) / 100).toLocaleString('ar-EG', { maximumFractionDigits: 2 }) + '٪ فعليًا.</p>' : '');
}

function calcRev() {
  const f = num('final2'), p = num('pct3');
  const o = original(f, p);
  const el = g('out2');
  el.classList.remove('hidden');
  el.innerHTML = isNaN(o) ? '<p>راجع الأرقام المدخلة.</p>'
    : '<p class="big">السعر الأصلي قبل الخصم: <b>' + fmt(o) + '</b></p><p>المتجر خصم فعليًا: <b>' + fmt(o - f) + '</b></p>';
}

window.__test = function () {
  const a = discount(1000, [15]);
  const b = discount(1000, [20, 10]);
  const c = original(850, 15);
  const ok = Math.abs(a.final - 850) < 0.001 && Math.abs(a.saved - 150) < 0.001 &&
             Math.abs(b.final - 720) < 0.001 &&
             Math.abs(c - 1000) < 0.001;
  return { pass: ok, details: { a, b, c } };
};

window.__demo = function () {
  g('price').value = 1250; g('pct').value = 20; g('pct2').value = 10;
  calc();
};

</script>
</body>
</html>
